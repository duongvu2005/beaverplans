name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - run: npm ci

            # vitest never typechecks, so type errors in *.test.ts(x) surface
            # only here.
            - name: Typecheck and build
              run: npm run build

            # Run even after an earlier failure, so one run reports every
            # failing gate rather than just the first.
            - name: Lint
              if: ${{ !cancelled() }}
              run: npm run lint

            - name: Format
              if: ${{ !cancelled() }}
              run: npm run format:check

            - name: Test
              if: ${{ !cancelled() }}
              run: npm test
